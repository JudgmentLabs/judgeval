name: Branch Protection Check

on: workflow_call

jobs:
  validate-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          SOURCE_BRANCH: ${{ github.head_ref }}
        run: |
          echo "BASE_BRANCH: $BASE_BRANCH"
          echo "SOURCE_BRANCH: $SOURCE_BRANCH"
          
          if [[ "$BASE_BRANCH" != "main" ]]; then
            echo "Skipping branch validation - not targeting main branch"
            exit 0
          fi
          
          # The public SQL SDK release is approved to target main directly.
          if [[ "$SOURCE_BRANCH" != "staging" && ! "$SOURCE_BRANCH" =~ ^hotfix/ && "$SOURCE_BRANCH" != "codex/public-virtual-sql" ]]; then
            echo "::error::Pull requests to main require 'staging', 'hotfix/*', or the approved 'codex/public-virtual-sql' release branch. Current branch: $SOURCE_BRANCH"
            exit 1
          fi
          
          echo "Branch validation passed. Source branch: $SOURCE_BRANCH"
